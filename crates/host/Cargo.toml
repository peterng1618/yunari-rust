[package]
name = "yunari-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
axum = "0.8.9"
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"
jiff.workspace = true
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "http1", "http2", "tokio", "service"] }
rand = "0.10.4"
rcgen = { version = "0.14.10", features = ["pem"] }
# ring is the provider ureq's TLS already uses; one provider in the process
# keeps rustls from refusing to pick one at runtime.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
sysinfo.workspace = true
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "net", "io-util", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
tower = "0.5"
yunari-library.workspace = true
yunari-model.workspace = true
yunari-panels.workspace = true
yunari-providers.workspace = true
yunari-render.workspace = true
yunari-render-raster.workspace = true
image.workspace = true
