[workspace]
resolver = "3"
members = [
    "crates/model",
    "crates/theme",
    "crates/golden",
    "crates/providers",
    "crates/library",
    "crates/editor",
    "crates/player",
    "crates/render",
    "crates/raster",
    "crates/render-gpui",
    "crates/app",
    "crates/host",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ignored = "0.1"
thiserror = "2"
jiff = "0.2"
sysinfo = "0.40"
image = "0.25"
proptest = "1"
yunari-model = { path = "crates/model" }
yunari-player = { path = "crates/player" }
yunari-editor = { path = "crates/editor" }
yunari-library = { path = "crates/library" }
yunari-providers = { path = "crates/providers" }
yunari-render = { path = "crates/render" }
yunari-golden = { path = "crates/golden" }
yunari-render-gpui = { path = "crates/render-gpui" }
yunari-render-raster = { path = "crates/raster" }
yunari-host = { path = "crates/host" }
